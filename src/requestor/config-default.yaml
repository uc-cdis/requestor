####################
# SERVER           #
####################

DEBUG: true
DOCS_URL_PREFIX: /requestor

# ignored if already set as an environment variable
ARBORIST_URL:

####################
# DATABASE         #
####################

DB_DRIVER: postgresql+asyncpg
DB_HOST:
DB_PORT:
DB_USER:
DB_PASSWORD:
DB_DATABASE: requestor_test

DB_POOL_MIN_SIZE: 1
DB_POOL_MAX_SIZE: 16
DB_ECHO: False
DB_SSL:

# set to true to disable requests to Arborist during database migrations;
# useful when migrating a local database or running unit tests
LOCAL_MIGRATION: false


####################
# REQUEST BACKEND   #
####################

# requestor: existing behavior
# rems: create/locate the matching REMS resource/catalogue item and return redirect_url
# dual: run existing behavior and REMS adapter; useful for migration/testing
REQUEST_BACKEND: requestor

REMS:
  ENABLED: true
  URL: ""
  API_KEY: ""
  USER_ID: requestor
  CREATE_APPLICATION: false
  CATALOGUE_ITEM_URL_TEMPLATE: ""
  APPLICATION_URL_TEMPLATE: ""
  # Duration in days for Arborist group membership granted on REMS approval.
  # After this period the delete_expired_access job removes the membership automatically.
  # The REMS revoke/close/expired webhook event removes access immediately regardless.
  DEFAULT_ACCESS_DURATION_DAYS: 365
  # Backend for applying entitlements when REMS approves/revokes an application.
  #   arborist (default): directly update Arborist group membership.
  #                       authz_provider='requestor' gives full audit trail.
  #   lambda:             invoke an AWS Lambda via IAM (boto3) with a generic
  #                       entitlement payload. Lambda handles AAI-specific update.
  #                       Requires ENTITLEMENT_LAMBDA_NAME and pod IAM permissions.
  ENTITLEMENT_BACKEND: "arborist"
  # Lambda function name or ARN. Required when ENTITLEMENT_BACKEND=lambda.
  # The Requestor pod's IAM role must have lambda:InvokeFunction on this function.
  ENTITLEMENT_LAMBDA_NAME: ""
  # Template for deriving the entitlement name from a REMS resource path.
  # <program> and <project> are substituted from /programs/<program>/projects/<project>.
  # For backend=arborist: this must match a group name defined in user.yaml.
  # For backend=lambda: this is passed as "entitlement" in the Lambda payload.
  # Note: use <program>/<project> not {program}/{project} — gen3config intercepts {}.
  GROUP_NAME_TEMPLATE: "<program>_<project>_readonly"
  AUTH0_ROLE_TEMPLATE: "acdc/<program>_<project>_readonly"

####################
# REQUEST STATUSES #
####################

ALLOWED_REQUEST_STATUSES:
  - DRAFT
  - SUBMITTED
  - APPROVED
  - SIGNED
  - REJECTED

# status of new requests when no status is specified by
# the user
DEFAULT_INITIAL_STATUS: DRAFT

# users are not blocked from requesting access again. the same request ID
# would be used but actions (such as redirect) would be triggered again.
DRAFT_STATUSES:
  - DRAFT

# automatically update the user's access. there is no logic to block users
# from requesting access again (this can be done on the client side) or to
# prevent updating access requests - unless also configured as a FINAL_STATUS.
UPDATE_ACCESS_STATUSES:
  - SIGNED

# access requests cannot be updated anymore, but users are not blocked
# from requesting access again. a new request ID would be generated.
FINAL_STATUSES:
  - SIGNED
  - REJECTED

############################
# ACTIONS ON STATUS UPDATE #
############################

# max number of times to retry external calls before giving up
DEFAULT_MAX_RETRIES: 5

REDIRECT_CONFIGS: {}
  # my_redirect:
  #   redirect_url: http://localhost?something
  #   params:
  #     - request_id
  #     - resource_id
  #     - resource_display_name

# only form parameters are supported at the moment. Query, path,
# body, etc parameters could be supported as well in the future
EXTERNAL_CALL_CONFIGS: {}
  # let_someone_know:
  #   method: POST
  #   url: https://abc_system/approve
  #   form:
  #     - name: dataset       # parameter name in the external call
  #       param: resource_id  # internal parameter name (a field from the DB)
  #     - name: username
  #       param: username
  #   creds: ""               # optional - a key from the CREDENTIALS section

# configure actions to trigger when the status of an access request for the
# specified resource path is updated. Multiple actions can be triggered by a
# single event, except redirect actions: if multiple "redirect_configs" match
# the event, only the first one is considered
ACTION_ON_UPDATE: {}
  # /resource/with/redirect:
  #   DRAFT:
  #     redirect_configs:
  #       - my_redirect
  #     external_call_configs:
  #       - let_someone_know

# only the "client_credentials" type is supported at the moment
CREDENTIALS: {}
  # unique_creds_id:
  #   type: client_credentials
  #   config:
  #     client_id: ""
  #     client_secret: ""
  #     url: "" # token endpoint
  #     scope: "space separated list of scopes"

# Shared secret for authenticating incoming REMS webhook calls.
# Must match the value in REMS config.edn event-notification-targets headers.
# REQUIRED — the webhook endpoint bypasses CSRF protection so this secret is
# the sole authentication mechanism. Requests will be rejected if not set.
REMS_WEBHOOK_SECRET: ""